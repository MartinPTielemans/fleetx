name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' apps/cli/package.json > /tmp/p && mv /tmp/p apps/cli/package.json
          pnpm --filter fleetx build
          cp apps/cli/dist/bin.mjs fleetx.mjs
          sha256sum fleetx.mjs install.sh > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: fleetx.mjs
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fleetx.mjs install.sh SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
      - name: npm (when an NPM_TOKEN secret is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        working-directory: apps/cli
        run: npm publish --provenance --access public
