name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' apps/cli/package.json > /tmp/p && mv /tmp/p apps/cli/package.json
          pnpm --filter t3-fleet build
          cp apps/cli/dist/bin.mjs t3-fleet.mjs
          sha256sum t3-fleet.mjs install.sh > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: t3-fleet.mjs
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" t3-fleet.mjs install.sh SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
      - name: npm (when an NPM_TOKEN secret is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        working-directory: apps/cli
        run: npm publish --provenance --access public
      - name: Point the Nix flake at this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          hash="sha256-$(openssl dgst -sha256 -binary t3-fleet.mjs | base64)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main && git checkout -q main
          printf '{\n  "version": "%s",\n  "hash": "%s"\n}\n' "$version" "$hash" > nix/release.json
          git add nix/release.json && git commit -q -m "Nix: T3 Fleet $version" && git push -q origin main || echo "flake already current"
      - name: Update the Homebrew formula (when a HOMEBREW_TAP_TOKEN secret is configured)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum t3-fleet.mjs | cut -d' ' -f1)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/MartinPTielemans/homebrew-tap.git" tap
          cd tap
          # The formula keeps its file name until the owner renames it; its URL names t3-fleet.mjs.
          sed -i -e "s#releases/download/v[^/]*/[^/\"]*\.mjs#releases/download/v${version}/t3-fleet.mjs#" \
                 -e "s/^  version \".*\"/  version \"${version}\"/" \
                 -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Formula/fleetx.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "T3 Fleet ${version}" && git push -q
