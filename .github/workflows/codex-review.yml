name: Codex review
# Keeps the `codex-review` status on each pull request's head current, so
# main's ruleset can hold a merge until Codex has reviewed that commit
# (scripts/codex-review-status.sh says how). It runs when the head moves and
# whenever Codex writes or edits a comment, which is how Codex reports a review
# starting and finishing.
#
# Both triggers run this file and the script as they are on main, never as a
# pull request has them: a pull request that could change the gate could pass
# it. pull_request_target checks out the base branch, and nothing here reads
# the pull request's tree.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
jobs:
  status:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    # On the job, so a skipped run (anyone else's comment) cannot cancel a real one.
    # Every run reads the current state, so only the newest matters.
    concurrency:
      group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - run: scripts/codex-review-status.sh "$REPO" "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
