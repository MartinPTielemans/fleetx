name: Codex review
# Keeps the `codex-review` status on each pull request's head current, so
# main's ruleset can hold a merge until Codex has reviewed that commit
# (scripts/codex-review-status.sh says how). It runs when the head or the base
# moves, and whenever Codex writes or edits a comment, which is how Codex
# reports a review starting and finishing.
#
# Both triggers run this file and the script as they are on main, never as a
# pull request has them: a pull request that could change the gate could pass
# it. pull_request_target checks out the base branch, and nothing here reads
# the pull request's tree.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
jobs:
  status:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    # One run at a time per pull request, none cancelled: a cancelled run's
    # status request may still land after a newer run's. A run waiting behind
    # another reads the state it starts with, so the last write is the newest.
    concurrency:
      group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - run: scripts/codex-review-status.sh "$REPO" "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
