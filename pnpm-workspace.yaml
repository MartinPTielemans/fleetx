packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

# Pinned to the versions T3 Code ships with, so code moves between the two
# repositories without dependency drift.
catalog:
  "@effect/platform-node": 4.0.0-rc.115
  "@effect/platform-node-shared": 4.0.0-rc.115
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.0-rc.115
  "@types/node": 24.12.4
  age-encryption: 0.3.1
  effect: 4.0.0-rc.115
  smol-toml: 1.4.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  # The UI (apps/ui), at the versions T3 Code's web app resolves to.
  "@base-ui/react": 1.5.0
  "@tailwindcss/vite": 4.3.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.2
  class-variance-authority: 0.7.1
  lucide-react: 0.564.0
  react: 19.2.6
  react-dom: 19.2.6
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3

# As in T3 Code: vitest comes from vite-plus, not a second copy.
overrides:
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest>vitest": "-"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"
